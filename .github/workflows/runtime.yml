name: Runtime CLI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  runtime:
    name: Go Host Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Show Go version
        run: go version
      - name: Check Go runtime formatting
        run: |
          find backend/cmd/cddm-change -type f -name '*.go' -print0 | xargs -0 gofmt -l > /tmp/cddm-gofmt.list
          if [[ -s /tmp/cddm-gofmt.list ]]; then
            cat /tmp/cddm-gofmt.list
            exit 1
          fi
      - name: Upload Go formatting diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cddm-gofmt-list
          path: /tmp/cddm-gofmt.list
          if-no-files-found: ignore
      - name: Test Go runtime
        working-directory: backend
        run: |
          set -o pipefail
          go test ./cmd/cddm-change 2>&1 | tee /tmp/cddm-runtime-test.log
      - name: Upload runtime test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cddm-runtime-test-log
          path: /tmp/cddm-runtime-test.log
          if-no-files-found: ignore
      - name: Verify consequential native parity
        working-directory: backend
        run: |
          go test ./cmd/cddm-change -run 'Test(RunTurnStartResumeRotateWithFakeCodex|RecoverSuccessfulContinueExactlyOnce|RecoverDurable143DoesNotDispatch|StopRefusesReusedPIDIdentity|PublishRemoteDivergenceBecomesInconclusive|CandidateV2FailurePublishesNothing|CandidatePassCreatesExactCommitPushAndPR)$'
      - name: Build Go runtime
        run: |
          bash scripts/build-cddm-change.sh
          test "$(.worktrees/bin/cddm-change __build-revision)" = "$CANDIDATE_SHA"
      - name: Smoke repository launcher
        run: |
          scripts/cddm-codex-change.sh --color=never help >/dev/null
          NO_COLOR=1 scripts/cddm-codex-change.sh status 999999 >/tmp/cddm-status.txt
          ! grep -q $'\033' /tmp/cddm-status.txt

          mkdir -p .worktrees/runtime
          cat > .worktrees/runtime/issue-999998.json <<'JSON'
          {"version":4,"issue":999998,"branch":"change/999998","worktree":"","thread_id":"thread-idle","model":"gpt-test","reasoning":"medium","status":"CONTINUE","thread_turn_count":1,"total_turn_count":1,"thread_generation":1,"candidate_head":null,"pr":null,"active_pid":null,"active_mode":null,"active_events":null,"active_result":null,"active_v2_log":null}
          JSON
          timeout 2 scripts/cddm-codex-change.sh --color=never watch 999998 > /tmp/cddm-watch-idle.txt
          grep -q 'observer: no active turn' /tmp/cddm-watch-idle.txt
      - name: Smoke system-level cddm install
        run: |
          test -x scripts/install-cddm.sh
          install_dir="$RUNNER_TEMP/cddm-bin"
          CDDM_INSTALL_DIR="$install_dir" ./scripts/install-cddm.sh
          test "$($install_dir/cddm __build-revision)" = "$CANDIDATE_SHA"
          "$install_dir/cddm" version | grep -q "$CANDIDATE_SHA"
          "$install_dir/cddm" --color=never help >/dev/null

          other="$RUNNER_TEMP/other-repo"
          git init -b main "$other"
          git -C "$other" config user.name Runtime
          git -C "$other" config user.email runtime@example.test
          touch "$other/.keep"
          git -C "$other" add .keep
          git -C "$other" commit -m base
          mkdir -p "$other/nested/path"
          (cd "$other/nested/path" && "$install_dir/cddm" --color=never status 999999 > "$RUNNER_TEMP/system-status.txt")
          grep -q 'Issue #999999' "$RUNNER_TEMP/system-status.txt"
