name: Runtime CLI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  runtime:
    name: Go Host Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Show Go version
        run: go version
      - name: Check Go runtime formatting
        id: format
        run: |
          gofmt -d backend/cmd/cddm-change > /tmp/cddm-gofmt.diff
          test ! -s /tmp/cddm-gofmt.diff
      - name: Report formatting diagnostics
        if: failure() && steps.format.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '<!-- cddm-runtime-diagnostic -->'
            echo '## Runtime Go formatting diagnostic'
            echo
            echo '```diff'
            head -c 12000 /tmp/cddm-gofmt.diff
            echo
            echo '```'
          } > /tmp/comment.md
          gh issue comment 35 --repo NordCoder/cddm-dashboard --body-file /tmp/comment.md
      - name: Test Go runtime
        id: test
        working-directory: backend
        run: go test ./cmd/cddm-change 2>&1 | tee /tmp/cddm-go-test.log
      - name: Report compile/test diagnostics
        if: failure() && steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '<!-- cddm-runtime-diagnostic -->'
            echo '## Runtime Go compile/test diagnostic'
            echo
            echo '```text'
            tail -c 12000 /tmp/cddm-go-test.log
            echo
            echo '```'
          } > /tmp/comment.md
          gh issue comment 35 --repo NordCoder/cddm-dashboard --body-file /tmp/comment.md
      - name: Build Go runtime
        run: |
          bash scripts/build-cddm-change.sh
          test "$(.worktrees/bin/cddm-change __build-revision)" = "$CANDIDATE_SHA"
      - name: Smoke public launcher
        run: |
          scripts/cddm-codex-change.sh --color=never help >/dev/null
          NO_COLOR=1 scripts/cddm-codex-change.sh status 999999 >/tmp/cddm-status.txt
          ! grep -q $'\033' /tmp/cddm-status.txt
