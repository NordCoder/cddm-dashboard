name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log
      - name: Upload backend test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/test.log
          if-no-files-found: error
      - name: Race detector
        run: go test -race ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Validate Codex host scripts
        run: |
          bash -n scripts/cddm-codex-change.sh
          bash -n scripts/cddm-codex-change-compat.sh
          bash -n scripts/cddm-codex-change-core.sh
          bash -n scripts/cddm-codex-worker-shim.sh
          bash -n scripts/cddm-host-tool-shim.sh
          bash -n scripts/build-cddm-change.sh
          bash -n scripts/cddm-publish-branch.sh
          bash -n scripts/test-cddm-runtime-r1.sh
          python3 -m py_compile scripts/cddm-codex-observe.py scripts/cddm-codex-proxy.py
      - name: Build Go Host runtime
        run: |
          bash scripts/build-cddm-change.sh
          test "$(.worktrees/bin/cddm-change __build-revision)" = "$CANDIDATE_SHA"
          .worktrees/bin/cddm-change --color=never help >/dev/null
      - name: Validate Codex project config
        run: python3 -c 'import pathlib, tomllib; tomllib.loads(pathlib.Path(".codex/config.toml").read_text())'
      - name: Validate Codex result schema
        run: python3 -c 'import json, pathlib; json.loads(pathlib.Path(".codex/schemas/change-turn-result.json").read_text())'
      - name: Validate persistent-session invariants
        run: |
          ! grep -q -- '--ephemeral' scripts/cddm-codex-change-core.sh
          grep -q -- '--ignore-user-config' scripts/cddm-codex-change-core.sh
          grep -q 'resume "$thread_id"' scripts/cddm-codex-change-core.sh
          grep -q 'thread.started' scripts/cddm-codex-change-core.sh
          grep -q 'thread_history' scripts/cddm-codex-change-core.sh
          grep -q 'START_FAILED_NO_THREAD' scripts/cddm-codex-change-core.sh
          grep -q 'PUSHED_PENDING_GITHUB' scripts/cddm-codex-change-core.sh
          grep -q 'Pending Candidate reconciliation must succeed before another Codex turn' scripts/cddm-codex-change-core.sh
          grep -q 'cddm-codex-change-compat.sh' scripts/cddm-codex-change.sh
          grep -q 'CDDM_CHANGE_BIN' scripts/cddm-codex-worker-shim.sh
          grep -q '__proxy' scripts/cddm-codex-worker-shim.sh
          grep -q '__v2tee' scripts/cddm-host-tool-shim.sh
          grep -q 'recover_change' scripts/cddm-codex-change-compat.sh
          grep -q 'stop_change' scripts/cddm-codex-change-compat.sh
          for prompt in .codex/prompts/change-start.md .codex/prompts/change-resume.md .codex/prompts/change-rotate.md; do
            grep -q 'Stable Change Goal:' "$prompt"
            grep -q 'Implement approved Change #{{ISSUE}} to locally candidate-ready state' "$prompt"
          done
      - name: Legacy R1 compatibility harness
        run: |
          cp scripts/cddm-codex-change.sh /tmp/cddm-go-launcher.sh
          cp scripts/cddm-codex-change-compat.sh scripts/cddm-codex-change.sh
          bash scripts/test-cddm-runtime-r1.sh
          cp /tmp/cddm-go-launcher.sh scripts/cddm-codex-change.sh
      - name: Validate configuration
        run: docker compose config --quiet
