name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: |
          find . -type f -name '*.go' -print0 | xargs -0 gofmt -l > /tmp/gofmt.list
          if [[ -s /tmp/gofmt.list ]]; then
            cat /tmp/gofmt.list
            exit 1
          fi
      - name: Test
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log
      - name: Upload backend test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: backend/test.log
          if-no-files-found: error
      - name: Race detector
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee race.log
      - name: Upload backend race log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-race-log
          path: backend/race.log
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Upload frontend test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: web/test.log
          if-no-files-found: error
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload frontend build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: web/build.log
          if-no-files-found: error

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test extension
        working-directory: extension
        run: npm test
      - name: Validate extension JavaScript modules
        run: |
          find extension/src -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Validate Host runtime launchers
        run: |
          bash -n scripts/cddm-codex-change.sh
          bash -n scripts/build-cddm-change.sh
          bash -n scripts/cddm-up.sh
          bash -n scripts/cddm-pilot-readiness.sh
          bash -n scripts/validate-pilot-assets.sh
          pwsh -NoProfile -Command '$tokens = $null; $parseErrors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/cddm-up.ps1"), [ref]$tokens, [ref]$parseErrors); if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }'
          pwsh -NoProfile -Command '$tokens = $null; $parseErrors = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "scripts/cddm-pilot-readiness.ps1"), [ref]$tokens, [ref]$parseErrors); if ($parseErrors.Count -gt 0) { $parseErrors | ForEach-Object { Write-Error $_ }; exit 1 }'
      - name: Build Go Host runtime
        run: |
          bash scripts/build-cddm-change.sh
          test "$(.worktrees/bin/cddm-change __build-revision)" = "$CANDIDATE_SHA"
          .worktrees/bin/cddm-change --color=never help >/dev/null
      - name: Validate Codex project config
        run: python3 -c 'import pathlib, tomllib; tomllib.loads(pathlib.Path(".codex/config.toml").read_text())'
      - name: Validate Codex result schema
        run: python3 -c 'import json, pathlib; json.loads(pathlib.Path(".codex/schemas/change-turn-result.json").read_text())'
      - name: Validate Go-only Host runtime cutover
        run: |
          for legacy in \
            scripts/cddm-codex-change-compat.sh \
            scripts/cddm-codex-change-core.sh \
            scripts/cddm-codex-worker-shim.sh \
            scripts/cddm-host-tool-shim.sh \
            scripts/cddm-codex-observe.py \
            scripts/cddm-codex-proxy.py \
            scripts/cddm-publish-branch.sh \
            scripts/test-cddm-runtime-r1.sh; do
            test ! -e "$legacy"
          done
          grep -q 'return commandMutating' backend/cmd/cddm-change/main.go
          grep -q 'Setpgid: true' backend/cmd/cddm-change/codex_engine.go
          grep -q 'GIT_CONFIG_GLOBAL=/dev/null' backend/cmd/cddm-change/codex_engine.go
          grep -q 'thread.started' backend/cmd/cddm-change/codex_engine.go
          grep -q 'recoverActive' backend/cmd/cddm-change/recovery.go
          grep -q 'PUBLISH_INCONCLUSIVE' backend/cmd/cddm-change/dispatch.go
          ! grep -R -n -E 'cddm-codex-change-(compat|core)|cddm-codex-worker-shim|cddm-host-tool-shim|cddm-codex-(observe|proxy)\.py|test-cddm-runtime-r1' backend/cmd/cddm-change scripts/cddm-codex-change.sh scripts/build-cddm-change.sh
          for prompt in .codex/prompts/change-start.md .codex/prompts/change-resume.md .codex/prompts/change-rotate.md; do
            grep -q 'Stable Change Goal:' "$prompt"
            grep -q 'Implement approved Change #{{ISSUE}} to locally candidate-ready state' "$prompt"
          done
      - name: Validate configuration
        run: |
          docker compose config --quiet
          rendered="$(docker compose config)"
          test "$(grep -c 'host_ip: 127.0.0.1' <<<"$rendered")" -eq 2
          grep -q 'published: "1337"' <<<"$rendered"
          grep -q 'published: "1338"' <<<"$rendered"
          grep -q 'GITHUB_AUTH_MODE: auto' <<<"$rendered"
      - name: Validate packaged worker resources
        run: bash scripts/validate-pilot-assets.sh resources
      - name: Validate pilot sample configuration
        run: bash scripts/validate-pilot-assets.sh samples
      - name: Validate pilot documentation
        run: bash scripts/validate-pilot-assets.sh docs
