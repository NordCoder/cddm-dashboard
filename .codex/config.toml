# Project-scoped Codex Worker defaults. Loaded only when this repository is trusted.
# Task-specific model tier and reasoning effort are selected by the Web Lead.

# Workers never need interactive elevation: host-side orchestration performs Git/GitHub writes.
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "cached"
model_reasoning_summary = "none"
model_verbosity = "low"

# Network is available for bounded read-only GitHub access and task research.
[sandbox_workspace_write]
network_access = true

# CDDM parallelism is Change/worktree-level, not an internal swarm inside one Change.
[agents]
enabled = false
