# Project-scoped defaults for CDDM Codex Minimal 3.0 WebLead Change Workers.
# The Web Lead chooses the model/effort; the Host passes them explicitly on every start/resume.

approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "cached"
model_reasoning_summary = "none"
model_verbosity = "low"

[sandbox_workspace_write]
network_access = false

[features]
goals = true

# Parallelism is Change/worktree-level. One Change keeps one primary persistent thread.
[agents]
enabled = false
